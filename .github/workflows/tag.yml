name: Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    env:
      GIT_COMMITTER_NAME: Tagga
      GIT_COMMITTER_EMAIL: tagga@github
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update tags and releases
        run: |
          version=$(sed -nE 's|^FROM jetbrains/intellij-http-client:([0-9]+\.[0-9]+\.[0-9]+)$|\1|p' Dockerfile)
          [[ -n "$version" ]] || { echo "Can't determine the version from the Dockerfile" >&2; exit 1; }

          minor=${version%.*}
          major=${minor%.*}

          # Creates the release for the tag, or rewrites the notes of the existing one.
          release() {
            local tag=$1 notes=$2 latest=$3

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag" --notes "$notes" --latest="$latest"
            else
              gh release create "$tag" --verify-tag --title "$tag" --notes "$notes" --latest="$latest"
            fi
          }

          # The full version is created once and never moved. Its notes are generated by GitHub.
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            git tag -m "v$version" "v$version"
            git push origin "refs/tags/v$version"
            release "v$version" "$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$version" --jq .body)" true
          fi

          # The floating tags are moved. Their notes list what has changed since the previous move.
          for tag in "v$minor" "v$major" latest; do
            old=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)

            [[ "$old" != "$(git rev-parse HEAD)" ]] || continue

            if [[ -n "$old" ]]; then
              notes="Changes since the previous \`$tag\`:"$'\n\n'"$(git log --first-parent --format='* %s' "$old..HEAD")"
            else
              notes="The first \`$tag\`."
            fi

            git tag -f -m "$tag" "$tag"
            git push --force origin "refs/tags/$tag"
            release "$tag" "$notes" false
          done
